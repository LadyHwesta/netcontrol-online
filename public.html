<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="seo-title">Live Nets — NetControl Online</title>
  <meta id="seo-description" name="description" content="See which amateur radio and GMRS nets are on the air right now, with live check-in rosters." />
  <link id="seo-canonical" rel="canonical" href="/live" />
  <meta id="seo-og-type" property="og:type" content="website" />
  <meta id="seo-og-title" property="og:title" content="Live Nets — NetControl Online" />
  <meta id="seo-og-description" property="og:description" content="See which amateur radio and GMRS nets are on the air right now, with live check-in rosters." />
  <meta id="seo-og-url" property="og:url" content="/live" />
  <meta id="seo-og-image" property="og:image" content="/static/icons/icon-512.png" />
  <meta name="robots" content="noindex, follow" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='96' fill='%230a0a1a'/%3E%3Cline x1='256' y1='256' x2='256' y2='120' stroke='%230099ff' stroke-width='16' stroke-linecap='round'/%3E%3Cline x1='256' y1='256' x2='146' y2='336' stroke='%230099ff' stroke-width='16' stroke-linecap='round'/%3E%3Cline x1='256' y1='256' x2='366' y2='336' stroke='%230099ff' stroke-width='16' stroke-linecap='round'/%3E%3Ccircle cx='256' cy='120' r='34' fill='%230099ff'/%3E%3Ccircle cx='146' cy='336' r='34' fill='%230099ff'/%3E%3Ccircle cx='366' cy='336' r='34' fill='%230099ff'/%3E%3Ccircle cx='256' cy='256' r='52' fill='%23ff9900'/%3E%3Ccircle cx='256' cy='256' r='17' fill='%230a0a1a'/%3E%3C/svg%3E" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="stylesheet" href="/static/vendor/leaflet/leaflet.css?v=1">
  <meta name="theme-color" content="#0a0a1a" />
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <script>(function(){var t=localStorage.getItem('nt_theme');if(t)document.documentElement.dataset.theme=t;var l=localStorage.getItem('nt_lang');if(l&&l!=='en')document.documentElement.lang=l;})();</script>
  <style>
    /* ── LCARS-inspired palette ───────────────────────── */
    :root {
      --lc-bg:      #0a0a1a;
      --lc-surface: #111128;
      --lc-border:  #2a2a4a;
      --lc-orange:  #ff9900;
      --lc-blue:    #0099ff;
      --lc-tan:     #cc9966;
      --lc-red:     #ff3333;
      --lc-green:   #00cc66;
      --lc-text:    #e8e8f0;
      --lc-muted:   #888899;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --lc-bg:      #FAFAF8;
        --lc-surface: #FFFFFF;
        --lc-border:  #D8D8D4;
        --lc-orange:  #C97400;
        --lc-blue:    #3355CC;
        --lc-tan:     #A8763F;
        --lc-red:     #C82F16;
        --lc-green:   #1F8F52;
        --lc-text:    #1A1A1A;
        --lc-muted:   #56606E;
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--lc-bg);
      color: var(--lc-text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
    }

    /* ── Header ──────────────────────────────────────── */
    header {
      background: var(--lc-surface);
      border-bottom: 3px solid var(--lc-orange);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    header h1 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: .06em;
      color: var(--lc-orange);
    }
    header h1 span { color: var(--lc-blue); }
    .header-sub {
      margin-left: auto;
      font-size: 12px;
      color: var(--lc-muted);
      text-align: right;
      line-height: 1.5;
    }

    /* ── Layout ──────────────────────────────────────── */
    main { max-width: 860px; margin: 0 auto; padding: 28px 20px 60px; }

    /* ── Cards ───────────────────────────────────────── */
    .card {
      background: var(--lc-surface);
      border: 1px solid var(--lc-border);
      border-radius: 10px;
      padding: 18px 22px;
      margin-bottom: 16px;
    }
    .card-clickable {
      cursor: pointer;
      transition: border-color .15s, transform .1s;
    }
    .card-clickable:hover {
      border-color: var(--lc-blue);
      transform: translateY(-1px);
    }

    /* ── Section title ───────────────────────────────── */
    .section-title {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .1em;
      color: var(--lc-orange);
      text-transform: uppercase;
      margin-bottom: 18px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--lc-border);
    }

    /* ── Net card ────────────────────────────────────── */
    .net-name {
      font-size: 17px;
      font-weight: 700;
      color: var(--lc-text);
      margin-bottom: 6px;
    }
    .net-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      font-size: 13px;
      color: var(--lc-muted);
    }
    .net-meta strong { color: var(--lc-text); }
    .badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      border-radius: 10px;
      padding: 2px 9px;
      vertical-align: middle;
    }
    .badge-live { background: var(--lc-green); color: #000; }
    .badge-count { background: var(--lc-blue); color: #000; }

    /* ── Checkin table ───────────────────────────────── */
    .checkin-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      margin-top: 12px;
    }
    .checkin-table th {
      text-align: left;
      color: var(--lc-orange);
      font-size: 11px;
      letter-spacing: .08em;
      padding: 6px 10px;
      border-bottom: 1px solid var(--lc-border);
    }
    .checkin-table td {
      padding: 8px 10px;
      border-bottom: 1px solid var(--lc-border);
    }
    .checkin-table tr:last-child td { border-bottom: none; }
    .checkin-table .callsign { font-weight: 700; font-family: monospace; font-size: 14px; color: var(--lc-blue); }
    .checkin-table tr:hover td { background: rgba(255,255,255,.03); }

    /* ── Back button ─────────────────────────────────── */
    .btn-back {
      background: none;
      border: 1px solid var(--lc-border);
      color: var(--lc-muted);
      border-radius: 6px;
      padding: 6px 14px;
      font-size: 13px;
      cursor: pointer;
      margin-bottom: 20px;
      transition: border-color .15s, color .15s;
    }
    .btn-back:hover { border-color: var(--lc-blue); color: var(--lc-blue); }

    /* ── Empty / status states ───────────────────────── */
    .empty {
      text-align: center;
      padding: 48px 20px;
      color: var(--lc-muted);
    }
    .empty .icon { font-size: 48px; margin-bottom: 16px; }
    .empty p { font-size: 14px; line-height: 1.6; }

    /* ── Refresh bar ─────────────────────────────────── */
    .refresh-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12px;
      color: var(--lc-muted);
      margin-bottom: 20px;
    }
    .refresh-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--lc-green);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: .3; }
    }

    /* ── Detail header ───────────────────────────────── */
    .detail-header {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      margin-bottom: 18px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--lc-border);
    }
    .detail-stat { min-width: 120px; }
    .detail-stat .label { font-size: 11px; color: var(--lc-orange); letter-spacing: .08em; text-transform: uppercase; margin-bottom: 3px; }
    .detail-stat .value { font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
    .detail-avatar { width: 56px; height: 56px; border-radius: 50%; object-fit: cover; vertical-align: middle; border: 2px solid var(--lc-border); flex: none; }

    /* ── Footer ──────────────────────────────────────── */
    footer {
      text-align: center;
      font-size: 11px;
      color: var(--lc-muted);
      padding: 20px;
      border-top: 1px solid var(--lc-border);
      margin-top: 40px;
    }
    footer a { color: var(--lc-blue); text-decoration: none; }
    .lang-select {
      background: var(--lc-surface); border: 1px solid var(--lc-border); color: var(--lc-text);
      border-radius: 6px; padding: 4px 8px; font-size: 12px; font-family: inherit;
    }
  </style>
</head>
<body>

<!-- Language switcher (issue follow-up) -- this page has no #app header to
     live in yet, same "fixed corner" convention index.html's pre-login
     screen uses for the same reason. Hidden until at least one language is
     enabled (see i18n.js's _updateLangUi). -->
<div id="lang-corner" style="position:fixed;top:14px;right:14px;z-index:20;display:flex;align-items:center;gap:8px">
  <a class="i18n-credit" href="https://github.com/argosopentech/argos-translate" target="_blank" rel="noopener"
    style="display:none;font-size:10px;color:var(--lc-muted);text-decoration:none" title="This page's translation is machine-generated">🌐 via Argos Translate</a>
  <select class="lang-select" onchange="saveLang(this.value)" title="Language" style="display:none">
    <option value="en">English</option>
  </select>
</div>

<header>
  <img id="header-logo" src="/logo" alt="" style="max-height:40px;max-width:140px;display:none;border-radius:4px;object-fit:contain"
    onerror="this.style.display='none'" onload="this.style.display=''" />
  <span id="header-antenna" style="font-size:24px"><img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='96' fill='%230a0a1a'/%3E%3Cline x1='256' y1='256' x2='256' y2='120' stroke='%230099ff' stroke-width='16' stroke-linecap='round'/%3E%3Cline x1='256' y1='256' x2='146' y2='336' stroke='%230099ff' stroke-width='16' stroke-linecap='round'/%3E%3Cline x1='256' y1='256' x2='366' y2='336' stroke='%230099ff' stroke-width='16' stroke-linecap='round'/%3E%3Ccircle cx='256' cy='120' r='34' fill='%230099ff'/%3E%3Ccircle cx='146' cy='336' r='34' fill='%230099ff'/%3E%3Ccircle cx='366' cy='336' r='34' fill='%230099ff'/%3E%3Ccircle cx='256' cy='256' r='52' fill='%23ff9900'/%3E%3Ccircle cx='256' cy='256' r='17' fill='%230a0a1a'/%3E%3C/svg%3E" width="24" height="24" style="display:block;border-radius:22%;vertical-align:middle" alt=""></span>
  <div>
    <h1 id="header-title"><span>NetControl Online</span> — Live</h1>
    <div id="header-tagline" style="display:none;font-size:11px;color:rgba(0,0,0,0.6);font-weight:600;letter-spacing:.04em;margin-top:-2px"></div>
  </div>
  <div class="header-sub">
    <span data-i18n="Public view">Public view</span> &bull; <span data-i18n="Auto-updates every 30 seconds">Auto-updates every 30 seconds</span><br>

<main>
  <!-- List view -->
  <div id="view-list">

  <div id="view-detail" style="display:none">

    <div id="detail-aprs-map-card" class="card" style="display:none;margin-top:14px">

<footer>

<script src="/static/js/state.js?v=24"></script>
<script src="/static/js/utils.js?v=22"></script>
<script src="/static/js/i18n.js?v=4"></script>
<script src="/static/vendor/leaflet/leaflet.js?v=1"></script>
<script src="/static/js/aprs-map.js?v=41"></script>
<script>
  let listInterval = null;
  let detailInterval = null;
  let activeSessionId = null;

  // ── Clock ────────────────────────────────────────────
  function tickClock() {
    const now = new Date();
    const local = now.toLocaleTimeString();
    const utc   = now.toUTCString().match(/\d{2}:\d{2}:\d{2}/)[0];
    document.getElementById('clock').textContent = `${local}  /  ${utc}Z`;
  }
  tickClock();
  setInterval(tickClock, 1000);

  // ── Helpers ──────────────────────────────────────────
  function esc(s) {
    if (!s) return '';
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function elapsed(isoString) {
    const start = new Date(isoString);
    const diff  = Math.floor((Date.now() - start) / 1000);
    const h = Math.floor(diff / 3600);
    const m = Math.floor((diff % 3600) / 60);
    if (h > 0) return `${h}h ${m}m`;
    return `${m}m`;
  }

  function formatTime(isoString) {
    return new Date(isoString).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  // Multi-tenancy (issue #1) — /live/{slug} is read client-side from the URL
  // path, same convention as /directory/{slug}. Bare /live (no slug) shows an
  // org picker instead of polling for active sessions across every org.
  function orgSlugFromPath() {
    const parts = location.pathname.split('/').filter(Boolean); // ["live", "<slug>"]
    return parts.length > 1 ? decodeURIComponent(parts[1]) : null;
  }

  // ── List view ────────────────────────────────────────
  async function loadList() {
    const slug = orgSlugFromPath();
    if (!slug) return loadOrgPicker();
    try {
      const sessions = await fetch(API + '/public/active?org=' + encodeURIComponent(slug)).then(r => r.json());
      renderList(sessions);
      const now = new Date().toLocaleTimeString();
      document.getElementById('refresh-status').textContent = t('Last updated {time} — refreshes every 30s').replace('{time}', now);
    } catch {
      document.getElementById('refresh-status').textContent = t('Error loading — retrying…');
    }
  }

  async function loadOrgPicker() {
    document.getElementById('section-title').textContent = t('Choose an Organization');
    document.getElementById('refresh-bar').style.display = 'none';
    const el = document.getElementById('nets-container');
    try {
      const orgs = await fetch(API + '/public/organizations').then(r => r.json());
      if (!orgs.length) {
        el.innerHTML = `
          <div class="empty">
            <div class="icon">📡</div>
            <p>${t('No organizations have any nets listed in the public directory yet.')}</p>
          </div>`;
        return;
      }
      el.innerHTML = orgs.map(o => `
        <a class="card card-clickable" style="display:block;text-decoration:none;color:inherit" href="/live/${encodeURIComponent(o.slug)}">
          <div class="net-name">${esc(o.name)}</div>
        </a>`).join('');
    } catch {
      el.innerHTML = `<div class="empty"><p>${t("Couldn't load organizations — try refreshing.")}</p></div>`;
    }
  }

  function renderList(sessions) {
    const el = document.getElementById('nets-container');
    if (!sessions.length) {
      el.innerHTML = `
        <div class="empty">
          <div class="icon">📡</div>
          <p>${t('No nets are currently active.')}<br>${t('Check back later or visit again when a net is scheduled.')}</p>
        </div>`;
      return;
    }
    el.innerHTML = sessions.map(s => `
      <div class="card card-clickable" onclick="showDetail(${s.session_id})">
        <div style="display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap">
          <div style="flex:1;min-width:200px">
            <div class="net-name">
              ${esc(s.net_name)}
              <span class="badge badge-live" style="margin-left:6px">${t('LIVE')}</span>
            </div>
            <div class="net-meta" style="margin-top:8px">
              ${s.frequency ? `<span>📡 <strong>${esc(s.frequency)}</strong></span>` : ''}
              <span>⏱ ${t('On air')} <strong>${elapsed(s.started_at)}</strong> (${t('started')} ${formatTime(s.started_at)})</span>
              ${s.ncs_callsign ? `<span>🎙 ${t('NCS')}: <strong>${esc(s.ncs_callsign)}</strong>${s.ncs_name ? ' — ' + esc(s.ncs_name) : ''}</span>` : ''}
              ${s.broadcaster_callsign ? `<span>📻 ${esc(s.broadcast_label || t('Broadcaster'))}: <strong>${esc(s.broadcaster_callsign)}</strong>${s.broadcaster_name ? ' — ' + esc(s.broadcaster_name) : ''}</span>` : ''}
            </div>
          </div>
          <div style="text-align:center;padding-top:2px">
            <span class="badge badge-count" style="font-size:16px;padding:4px 14px">${s.checkin_count}</span>
            <div style="font-size:11px;color:var(--lc-muted);margin-top:3px">${t('checked in')}</div>
          </div>
        </div>
      </div>
    `).join('');
  }

  function startListPolling() {
    clearInterval(listInterval);
    loadList();
    if (orgSlugFromPath()) listInterval = setInterval(loadList, 30000);   // no point polling the static org picker
  }

  // ── Detail view ──────────────────────────────────────
  async function loadDetail() {
    if (!activeSessionId) return;
    try {
      const s = await fetch(API + `/public/sessions/${activeSessionId}`).then(r => {
        if (!r.ok) throw new Error('gone');
        return r.json();
      });
      renderDetail(s);
      const now = new Date().toLocaleTimeString();
      document.getElementById('detail-refresh-status').textContent = t('Last updated {time} — refreshes every 30s').replace('{time}', now);
    } catch (e) {
      if (e.message === 'gone') {
        // Net ended — return to list
        showList();
        return;
      }
      document.getElementById('detail-refresh-status').textContent = t('Error loading — retrying…');
    }
  }

  function renderDetail(s) {
    document.getElementById('detail-net-name').textContent = s.net_name;

    const mapCard = document.getElementById('detail-aprs-map-card');
    if (s.aprs_map_enabled && s.aprs_positions && s.aprs_positions.length > 0) {
      mapCard.style.display = '';
      initAprsMap('detail-aprs-map-container', s.aprs_positions, s.aprs_source, s.aprs_default_zoom != null ? { lat: s.aprs_default_lat, lon: s.aprs_default_lon, zoom: s.aprs_default_zoom } : null);
      setTimeout(() => invalidateAprsMapSize('detail-aprs-map-container'), 0);
    } else {
      mapCard.style.display = 'none';
    }

    document.getElementById('detail-header').innerHTML = `
      ${s.frequency ? `<div class="detail-stat"><div class="label">${t('Frequency')}</div><div class="value">📡 ${esc(s.frequency)}</div></div>` : ''}
      ${s.ncs_callsign ? `<div class="detail-stat"><div class="label">${t('Net Control')}</div><div class="value">${s.ncs_user_id ? `<img class="detail-avatar" src="/users/${s.ncs_user_id}/photo" onerror="this.style.display='none'" alt="" />` : ''}🎙 ${esc(s.ncs_callsign)}${s.ncs_name ? ' — ' + esc(s.ncs_name) : ''}</div></div>` : ''}
      ${s.broadcaster_callsign ? `<div class="detail-stat"><div class="label">${esc(s.broadcast_label || t('Broadcaster'))}</div><div class="value">${s.broadcaster_user_id ? `<img class="detail-avatar" src="/users/${s.broadcaster_user_id}/photo" onerror="this.style.display='none'" alt="" />` : ''}📻 ${esc(s.broadcaster_callsign)}${s.broadcaster_name ? ' — ' + esc(s.broadcaster_name) : ''}</div></div>` : ''}
      <div class="detail-stat"><div class="label">${t('Started')}</div><div class="value">${formatTime(s.started_at)}</div></div>
      <div class="detail-stat"><div class="label">${t('On Air')}</div><div class="value">⏱ ${elapsed(s.started_at)}</div></div>
      <div class="detail-stat"><div class="label">${t('Check-Ins')}</div><div class="value"><span class="badge badge-count" style="font-size:14px;padding:3px 12px">${s.checkins.length}</span></div></div>
    `;

    const tbody = document.getElementById('detail-checkins');
    const emptyEl = document.getElementById('detail-empty');
    if (!s.checkins.length) {
      tbody.innerHTML = '';
      emptyEl.style.display = '';
    } else {
      emptyEl.style.display = 'none';
      tbody.innerHTML = s.checkins.map((c, i) => `
        <tr>
          <td style="color:var(--lc-muted);font-size:12px">${i + 1}</td>
          <td class="callsign">${esc(c.callsign)}</td>
          <td>${esc(c.name || '—')}</td>
        </tr>
      `).join('');
    }
  }

  function startDetailPolling() {
    clearInterval(detailInterval);
    loadDetail();
    detailInterval = setInterval(loadDetail, 30000);
  }

  // ── View switching ───────────────────────────────────
  function showDetail(sessionId) {
    activeSessionId = sessionId;
    clearInterval(listInterval);
    document.getElementById('view-list').style.display = 'none';
    document.getElementById('view-detail').style.display = '';
    document.getElementById('detail-checkins').innerHTML = '';
    document.getElementById('detail-empty').style.display = 'none';
    document.getElementById('detail-aprs-map-card').style.display = 'none';
    document.getElementById('detail-refresh-status').textContent = t('Loading…');
    startDetailPolling();
  }

  function showList() {
    activeSessionId = null;
    clearInterval(detailInterval);
    document.getElementById('view-detail').style.display = 'none';
    document.getElementById('view-list').style.display = '';
    startListPolling();
  }

  // ── Branding ─────────────────────────────────────────
  async function loadBranding() {
    try {
      const b = await fetch('/branding').then(r => r.json());
      const titleEl = document.getElementById('header-title');
      if (b.org_name) {
        titleEl.innerHTML = `<span>${esc(b.org_name)}</span> — ${t('Live')}`;
        document.title = b.org_name + ' — Live Nets';
      }
      const tagEl = document.getElementById('header-tagline');
      if (b.tagline) { tagEl.textContent = b.tagline; tagEl.style.display = ''; }
      if (b.website_url) {
        titleEl.style.cursor = 'pointer';
        titleEl.onclick = () => window.open(b.website_url, '_blank');
      }
      const logoEl = document.getElementById('header-logo');
      const antennaEl = document.getElementById('header-antenna');
      if (b.has_logo) {
        logoEl.src = '/logo?' + Date.now();
        antennaEl.style.display = 'none';
      }
    } catch {}
    // Per-org branding (issue follow-up) -- layers over the instance-wide
    // defaults just applied above, for the org this specific slug belongs
    // to: name always wins (every org has one); tagline/logo only when this
    // org has actually set its own, otherwise the instance default (or
    // built-in fallback) already showing is left alone. No slug (bare
    // /live org picker) -- nothing to layer, instance branding stands.
    const slug = orgSlugFromPath();
    if (!slug) return;
    try {
      const org = await fetch('/public/organizations/' + encodeURIComponent(slug)).then(r => r.ok ? r.json() : null);
      if (!org) return;
      const titleEl = document.getElementById('header-title');
      titleEl.innerHTML = `<span>${esc(org.name)}</span> — ${t('Live')}`;
      document.title = org.name + ' — Live Nets';
      if (org.website_url) {
        titleEl.style.cursor = 'pointer';
        titleEl.onclick = () => window.open(org.website_url, '_blank');
      }
      if (org.tagline) {
        const tagEl = document.getElementById('header-tagline');
        tagEl.textContent = org.tagline;
        tagEl.style.display = '';
      }
      if (org.has_logo) {
        document.getElementById('header-logo').src = `/orgs/${org.id}/logo?` + Date.now();
        document.getElementById('header-logo').style.display = '';
        document.getElementById('header-antenna').style.display = 'none';
      }
    } catch {}
  }

  // ── Boot ─────────────────────────────────────────────
  loadBranding();
  startListPolling();
  syncLangFromUser(null);   // fire-and-forget; non-blocking — auto-detects browser language here too
</script>
<script src="/static/js/pwa.js?v=2"></script>
</body>
</html>
