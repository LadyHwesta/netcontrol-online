  <script>(function(){var t=localStorage.getItem('nt_theme');if(t)document.documentElement.dataset.theme=t;var l=localStorage.getItem('nt_lang');if(l&&l!=='en')document.documentElement.lang=l;})();</script>
  <style>
    /* ── LCARS-inspired palette ───────────────────────── */
    :root {
      --lc-bg:      #0a0a1a;
      --lc-surface: #111128;
      --lc-border:  #2a2a4a;
      --lc-orange:  #ff9900;
      --lc-blue:    #0099ff;
      --lc-tan:     #cc9966;
      --lc-red:     #ff3333;
      --lc-green:   #00cc66;
      --lc-text:    #e8e8f0;
      --lc-muted:   #888899;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --lc-bg:      #FAFAF8;
        --lc-surface: #FFFFFF;
        --lc-border:  #D8D8D4;
        --lc-orange:  #C97400;
        --lc-blue:    #3355CC;
        --lc-tan:     #A8763F;
        --lc-red:     #C82F16;
        --lc-green:   #1F8F52;
        --lc-text:    #1A1A1A;
        --lc-muted:   #56606E;
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--lc-bg);
      color: var(--lc-text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
    }

    /* ── Header ──────────────────────────────────────── */
    header {
      background: var(--lc-surface);
      border-bottom: 3px solid var(--lc-orange);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    header h1 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: .06em;
      color: var(--lc-orange);
    }
    header h1 span { color: var(--lc-blue); }
    .header-sub {
      margin-left: auto;
      font-size: 12px;
      color: var(--lc-muted);
      text-align: right;
      line-height: 1.5;
    }

    /* ── Layout ──────────────────────────────────────── */
    main { max-width: 860px; margin: 0 auto; padding: 28px 20px 60px; }

    /* ── Cards ───────────────────────────────────────── */
    .card {
      background: var(--lc-surface);
      border: 1px solid var(--lc-border);
      border-radius: 10px;
      padding: 18px 22px;
      margin-bottom: 16px;
    }

    /* ── Section title ───────────────────────────────── */
    .section-title {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .1em;
      color: var(--lc-orange);
      text-transform: uppercase;
      margin-bottom: 18px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--lc-border);
    }

    /* ── Filter bar ──────────────────────────────────── */
    .filter-bar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }
    .filter-bar input, .filter-bar select {
      background: var(--lc-surface);
      border: 1px solid var(--lc-border);
      color: var(--lc-text);
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 13px;
      font-family: inherit;
    }
    .filter-bar input { flex: 1; min-width: 180px; }
    .filter-bar input:focus, .filter-bar select:focus { outline: none; border-color: var(--lc-blue); }

    /* ── Net card ────────────────────────────────────── */
    .net-name {
      font-size: 17px;
      font-weight: 700;
      color: var(--lc-text);
      margin-bottom: 6px;
    }
    .net-desc { font-size: 13px; color: var(--lc-muted); margin: 6px 0; line-height: 1.5; }
    .net-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      font-size: 13px;
      color: var(--lc-muted);
    }
    .net-meta strong { color: var(--lc-text); }
    .badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      border-radius: 10px;
      padding: 2px 9px;
      vertical-align: middle;
    }
    .badge-gmrs { background: var(--lc-green); color: #000; }
    .badge-broadcast { background: var(--lc-blue); color: #000; }

    .schedule-list {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--lc-border);
      font-size: 13px;
    }
    .schedule-row { padding: 3px 0; color: var(--lc-text); }
    .schedule-row .day { color: var(--lc-orange); font-weight: 700; }
    .schedule-notes { color: var(--lc-muted); }

    /* ── Empty / status states ───────────────────────── */
    .empty {
      text-align: center;
      padding: 48px 20px;
      color: var(--lc-muted);
    }
    .empty .icon { font-size: 48px; margin-bottom: 16px; }
    .empty p { font-size: 14px; line-height: 1.6; }

    /* ── Footer ──────────────────────────────────────── */
    footer {
      text-align: center;
      font-size: 11px;
      color: var(--lc-muted);
      padding: 20px;
      border-top: 1px solid var(--lc-border);
      margin-top: 40px;
    }
    footer a { color: var(--lc-blue); text-decoration: none; }
    .lang-select {
      background: var(--lc-surface); border: 1px solid var(--lc-border); color: var(--lc-text);
      border-radius: 6px; padding: 4px 8px; font-size: 12px; font-family: inherit;
    }
  </style>
</head>
<body>

<!-- Language switcher (issue follow-up) -- this page has no #app header to

     screen uses for the same reason. Hidden until at least one language is

<header>

    onerror="this.style.display='none'" onload="this.style.display=''" />
  <span id="header-antenna" style="font-size:24px"><img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='96' fill='%230a0a1a'/%3E%3Cline x1='256' y1='256' x2='256' y2='120' stroke='%230099ff' stroke-width='16' stroke-linecap='round'/%3E%3Cline x1='256' y1='256' x2='146' y2='336' stroke='%230099ff' stroke-width='16' stroke-linecap='round'/%3E%3Cline x1='256' y1='256' x2='366' y2='336' stroke='%230099ff' stroke-width='16' stroke-linecap='round'/%3E%3Ccircle cx='256' cy='120' r='34' fill='%230099ff'/%3E%3Ccircle cx='146' cy='336' r='34' fill='%230099ff'/%3E%3Ccircle cx='366' cy='336' r='34' fill='%230099ff'/%3E%3Ccircle cx='256' cy='256' r='52' fill='%23ff9900'/%3E%3Ccircle cx='256' cy='256' r='17' fill='%230a0a1a'/%3E%3C/svg%3E" width="24" height="24" style="display:block;border-radius:22%;vertical-align:middle" alt=""></span>
  <div>
    <h1 id="header-title"><span>NetControl Online</span> — Directory</h1>
    <div id="header-tagline" style="display:none;font-size:11px;color:rgba(0,0,0,0.6);font-weight:600;letter-spacing:.04em;margin-top:-2px"></div>
  </div>
  <div class="header-sub" id="header-sub">
    <span data-i18n="Public net directory">Public net directory</span><br>
    <a href="/live" id="live-link" style="color:var(--lc-blue);text-decoration:none"><span data-i18n="📡 See what's live now →">📡 See what's live now →</span></a>
  </div>
</header>

<main>
  <div class="section-title" id="section-title" data-i18n="Net Directory">Net Directory</div>

  <div class="filter-bar" id="filter-bar">
    <input type="text" id="search-box" placeholder="Search by name or frequency…" oninput="renderList()" data-i18n-placeholder="Search by name or frequency…" />
    <select id="type-filter" onchange="renderList()">
      <option value="" data-i18n="All Types">All Types</option>
      <option value="ham" data-i18n="Ham Radio">Ham Radio</option>
      <option value="gmrs" data-i18n="GMRS">GMRS</option>
    </select>
  </div>

  <div id="nets-container"></div>
</main>

<footer>
  <a href="https://github.com/LadyHwesta/netcontrol-online" target="_blank" rel="noopener">NetControl Online</a> &bull; <a href="/" data-i18n="Operator Login">Operator Login</a><br>
  &copy; <span id="footer-year"></span> NetControl Online &bull; <a href="https://github.com/LadyHwesta/netcontrol-online/blob/main/LICENSE" target="_blank" rel="noopener" data-i18n="Open Source (GPLv3)">Open Source (GPLv3)</a>
</footer>
<script>document.getElementById('footer-year').textContent = new Date().getFullYear();</script>

<script src="/static/js/state.js?v=24"></script>
<script src="/static/js/utils.js?v=21"></script>
<script src="/static/js/i18n.js?v=4"></script>
<script>
  let allNets = [];

  function esc(s) {
    if (!s) return '';
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function detectedTimezone() {
    try { return Intl.DateTimeFormat().resolvedOptions().timeZone; } catch { return null; }
  }

  // Convert a "HH:MM" wall-clock time declared in `tz` on `dateStr` (YYYY-MM-DD)
  // into a formatted time string in the viewer's own local timezone. DST-aware
  // since it's anchored to a real calendar date, not just a fixed offset.
  // Uses formatToParts rather than round-tripping through Date-string parsing,
  // since the latter silently depends on the *calling* environment's own local
  // timezone and gives wrong answers whenever the viewer isn't in UTC.
  function zonedTimeToLocalStr(dateStr, timeStr, tz) {
    try {
      const [year, month, day] = dateStr.split('-').map(Number);
      const [hour, minute] = timeStr.split(':').map(Number);
      const guessUtcMs = Date.UTC(year, month - 1, day, hour, minute);

      const parts = Object.fromEntries(
        new Intl.DateTimeFormat('en-US', {
          timeZone: tz, hourCycle: 'h23',
          year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit',
        }).formatToParts(new Date(guessUtcMs)).map(p => [p.type, p.value])
      );
      const asUtcMs = Date.UTC(+parts.year, +parts.month - 1, +parts.day, +parts.hour, +parts.minute, +parts.second);
      const offsetMs = asUtcMs - guessUtcMs;
      const actualUtcMs = guessUtcMs - offsetMs;

      return new Date(actualUtcMs).toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
    } catch {
      return null;
    }
  }

  // Next upcoming date (YYYY-MM-DD) for a given weekday (0=Monday..6=Sunday),
  // used to anchor a *recurring* schedule's local-time conversion to a real date.
  function nextDateForWeekday(dayOfWeek) {
    const today = new Date();
    const todayDow = (today.getDay() + 6) % 7; // JS Sunday=0 -> Monday=0 convention
    const daysAhead = (dayOfWeek - todayDow + 7) % 7;
    const d = new Date(today);
    d.setDate(d.getDate() + daysAhead);
    return d.toISOString().slice(0, 10);
  }

  // Multi-tenancy (issue #1) — /directory/{slug} is read client-side from the
  // URL path; bare /directory (no slug) shows an org picker instead of a net
  // list, since there's no single global directory to fall back to once an
  // instance has more than one organization.
  function orgSlugFromPath() {
    const parts = location.pathname.split('/').filter(Boolean); // ["directory", "<slug>"]
    return parts.length > 1 ? decodeURIComponent(parts[1]) : null;
  }

  async function loadDirectory() {
    const slug = orgSlugFromPath();
    if (!slug) return loadOrgPicker();

    document.getElementById('live-link').href = '/live/' + encodeURIComponent(slug);
    try {
      allNets = await fetch(API + '/public/directory?org=' + encodeURIComponent(slug)).then(r => r.json());
      renderList();
    } catch {
      document.getElementById('nets-container').innerHTML = `
        <div class="empty"><p>${t("Couldn't load the directory — try refreshing.")}</p></div>`;
    }
  }

  async function loadOrgPicker() {
    document.getElementById('section-title').textContent = t('Choose an Organization');
    document.getElementById('filter-bar').style.display = 'none';
    document.getElementById('header-sub').innerHTML = t('Public net directory');
    const el = document.getElementById('nets-container');
    try {
      const orgs = await fetch(API + '/public/organizations').then(r => r.json());
      if (!orgs.length) {
        el.innerHTML = `
          <div class="empty">
            <div class="icon">📖</div>
            <p>${t('No organizations have any nets listed in the public directory yet.')}</p>
          </div>`;
        return;
      }
      el.innerHTML = orgs.map(o => `
        <a class="card" style="display:block;text-decoration:none;color:inherit" href="/directory/${encodeURIComponent(o.slug)}">
          <div class="net-name">${esc(o.name)}</div>
        </a>`).join('');
    } catch {
      el.innerHTML = `<div class="empty"><p>${t("Couldn't load organizations — try refreshing.")}</p></div>`;
    }
  }

  function renderList() {
    const q = document.getElementById('search-box').value.trim().toLowerCase();
    const typeFilter = document.getElementById('type-filter').value;
    const el = document.getElementById('nets-container');

    const filtered = allNets.filter(n => {
      if (typeFilter && n.net_type !== typeFilter) return false;
      if (!q) return true;
      return (n.name || '').toLowerCase().includes(q) || (n.frequency || '').toLowerCase().includes(q);
    });

    if (!allNets.length) {
      el.innerHTML = `
        <div class="empty">
          <div class="icon">📖</div>
          <p>${t('No nets are listed in the public directory yet.')}<br>${t("Net owners can opt in from the net's Edit form.")}</p>
        </div>`;
      return;
    }
    if (!filtered.length) {
      el.innerHTML = `<div class="empty"><p>${t('No nets match your search.')}</p></div>`;
      return;
    }

    const dayOrder = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];

    el.innerHTML = filtered.map(n => {
      const gmrsBadge = n.net_type === 'gmrs' ? `<span class="badge badge-gmrs" style="margin-left:6px">${t('GMRS')}</span>` : '';
      const broadcastBadge = n.has_broadcast
        ? `<span class="badge badge-broadcast" style="margin-left:6px">📻 ${esc(n.broadcast_label || t('Broadcast'))}</span>`
        : '';
      const schedules = (n.schedules || []).slice().sort((a, b) => dayOrder.indexOf(a.day_name) - dayOrder.indexOf(b.day_name));
      const viewerTz = detectedTimezone();
      const scheduleHtml = schedules.length ? `
        <div class="schedule-list">
          ${schedules.map(s => {
            const showLocal = viewerTz && viewerTz !== s.timezone;
            const localStr = showLocal ? zonedTimeToLocalStr(nextDateForWeekday(dayOrder.indexOf(s.day_name)), s.start_time, s.timezone) : null;
            return `
            <div class="schedule-row">
              <span class="day">${esc(t(s.day_name))}</span> ${t('at')} ${esc(s.start_time)} ${esc(s.timezone)}
              ${localStr ? `<span class="schedule-notes"> (${esc(localStr)} ${t('your time')})</span>` : ''}
              ${s.notes ? `<span class="schedule-notes"> — ${esc(s.notes)}</span>` : ''}
            </div>
          `;
          }).join('')}
        </div>` : '';

      return `
      <div class="card">
        <div class="net-name">${esc(n.name)}${gmrsBadge}${broadcastBadge}</div>
        <div class="net-meta">
          ${n.frequency ? `<span>📡 <strong>${esc(n.frequency)}</strong></span>` : ''}
          ${n.owner_callsign ? `<span>👤 ${t('Hosted by')} <strong>${esc(n.owner_callsign)}</strong>${n.owner_name ? ' — ' + esc(n.owner_name) : ''}</span>` : ''}
        </div>
        ${n.description ? `<div class="net-desc">${esc(n.description)}</div>` : ''}
        ${scheduleHtml}
      </div>`;
    }).join('');
  }

  // ── Branding ─────────────────────────────────────────
  async function loadBranding() {
    try {
      const b = await fetch('/branding').then(r => r.json());
      const titleEl = document.getElementById('header-title');
      if (b.org_name) {
        titleEl.innerHTML = `<span>${esc(b.org_name)}</span> — ${t('Directory')}`;
        document.title = b.org_name + ' — Net Directory';
      }
      const tagEl = document.getElementById('header-tagline');
      if (b.tagline) { tagEl.textContent = b.tagline; tagEl.style.display = ''; }
      if (b.website_url) {
        titleEl.style.cursor = 'pointer';
        titleEl.onclick = () => window.open(b.website_url, '_blank');
      }
      const logoEl = document.getElementById('header-logo');
      const antennaEl = document.getElementById('header-antenna');
      if (b.has_logo) {
        logoEl.src = '/logo?' + Date.now();
        antennaEl.style.display = 'none';
      }
    } catch {}
    // Per-org branding (issue follow-up) -- layers over the instance-wide
    // defaults just applied above, for the org this specific slug belongs
    // to: name always wins (every org has one); tagline/logo only when this
    // org has actually set its own, otherwise the instance default (or
    // built-in fallback) already showing is left alone. No slug (bare
    // /directory org picker) -- nothing to layer, instance branding stands.
    const slug = orgSlugFromPath();
    if (!slug) return;
    try {
      const org = await fetch('/public/organizations/' + encodeURIComponent(slug)).then(r => r.ok ? r.json() : null);
      if (!org) return;
      const titleEl = document.getElementById('header-title');
      titleEl.innerHTML = `<span>${esc(org.name)}</span> — ${t('Directory')}`;
      document.title = org.name + ' — Net Directory';
      if (org.website_url) {
        titleEl.style.cursor = 'pointer';
        titleEl.onclick = () => window.open(org.website_url, '_blank');
      }
      if (org.tagline) {
        const tagEl = document.getElementById('header-tagline');
        tagEl.textContent = org.tagline;
        tagEl.style.display = '';
      }
      if (org.has_logo) {
        document.getElementById('header-logo').src = `/orgs/${org.id}/logo?` + Date.now();
        document.getElementById('header-logo').style.display = '';
        document.getElementById('header-antenna').style.display = 'none';
      }
    } catch {}
  }

  // ── Boot ─────────────────────────────────────────────
  loadBranding();
  loadDirectory();
  syncLangFromUser(null);   // fire-and-forget; non-blocking — auto-detects browser language here too
</script>
<script src="/static/js/pwa.js?v=2"></script>
